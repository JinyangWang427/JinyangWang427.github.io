name: Rename SV-WAM placeholder branch (one-time cleanup)

on:
  push:
    branches: [sv-wam]

permissions:
  contents: write

jobs:
  remove-obsolete-ref:
    if: github.ref == 'refs/heads/sv-wam'
    runs-on: ubuntu-latest
    steps:
      - name: Verify replacement README exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/contents/README.md?ref=sv-wam" --jq '.name' | grep -Fx README.md
      - name: Delete obsolete branch only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/sv-wam-code-coming-soon"
